      - name: Check Discovery skeptic check and economy tier are pinned
        run: |
          missing=0
          f=skills/three-amigos/references/CEREMONIES.md
          g=skills/subagent-driven-development/references/MODEL_SELECTION.md
          s='### Skeptic check'
          if ! grep -qxF -- "$s" "$f"; then
            printf 'FAILED: %s has no line equal to: %s\n' "$f" "$s"
            missing=$((missing + 1))
          fi
          s='| Three Amigos Ceremony 1 (Discovery) | Economy |'
          if ! grep -qF -- "$s" "$g"; then
            printf 'FAILED: %s has no text containing: %s\n' "$g" "$s"
            missing=$((missing + 1))
          fi
          s='| Three Amigos Ceremony 1 skeptic check | Standard |'
          if ! grep -qF -- "$s" "$g"; then
            printf 'FAILED: %s has no text containing: %s\n' "$g" "$s"
            missing=$((missing + 1))
          fi
          s='Exception: Three Amigos Ceremony 1 (Discovery) amigos run at Economy tier'
          if ! grep -qF -- "$s" "$g"; then
            printf 'FAILED: %s has no text containing: %s\n' "$g" "$s"
            missing=$((missing + 1))
          fi
          if [ "$missing" -gt 0 ]; then
            echo "Found $missing missing Discovery skeptic-check/economy-tier pin(s)"
            exit 1
          fi
          echo "[+] Discovery skeptic check and economy tier pins are present"

      # A pin proves the wording exists in the file, not where it sits or that a runner follows it.
      # The reference and Red Flag lines are whole-line matches; the Tester agenda sentence is a substring match.
      - name: Check acceptance proof kinds are pinned
        run: |
          missing=0
          f=skills/three-amigos/references/FORMULATION.md
          for s in \
            '## Proof kinds' \
            'Every acceptance criterion is proven by one of three proof kinds. A criterion with no stated proof kind is proven by an automated test. Skill and prompt text is documentation, not shipped code.' \
            '1. Automated test -- a test kept in the repository that fails before the change and passes after it. It applies to a criterion about behaviour of shipped code (anything a user or another program runs, such as a hook, a tool script or a CI step). Its proof is the test name and its run output.' \
            '2. Documentation evidence -- it applies to a criterion about the text of a document or skill file. Its proof is the file and line, or a command whose output shows the text.' \
            '3. Throwaway spike -- it applies to a criterion about a one-off investigation whose code is discarded. Its proof is the run command and its output, kept in the pull request or, when there is no pull request, in the issue; the spike code is not merged.' \
            'A criterion about behaviour of shipped code still requires an automated test; "the test is hard to write" is not a reason to choose another proof kind.' \
            'A criterion that fits none of the three proof kinds is proven by an automated test.' \
            'A criterion proven by documentation evidence or a throwaway spike ends with `Proof: documentation` or `Proof: spike`; the label applies to Given/When/Then and plain-language criteria alike.'
          do
            if ! grep -qxF -- "$s" "$f"; then
              printf 'FAILED: %s has no line equal to: %s\n' "$f" "$s"
              missing=$((missing + 1))
            fi
          done
          f=skills/user-story-generator/SKILL.md
          for s in \
            '- Can'\''t name a proof kind that fits an acceptance criterion under the Proof kinds section of the Formulation reference of the three-amigos skill, or the criterion is about behaviour of shipped code and no failing test can be written for it -> STOP. Rewrite the criterion until one proof kind can prove it; a criterion about behaviour of shipped code always needs an automated test.' \
            '- **Testable** - acceptance criteria are verifiable; for Given/When/Then wording and the proof kinds (automated test, documentation evidence, throwaway spike), load the three-amigos skill and follow its Formulation reference; a criterion proven by documentation evidence or a throwaway spike ends with `Proof: documentation` or `Proof: spike`'
          do
            if ! grep -qxF -- "$s" "$f"; then
              printf 'FAILED: %s has no line equal to: %s\n' "$f" "$s"
              missing=$((missing + 1))
            fi
          done
          f=skills/three-amigos/references/CEREMONIES.md
          s='Tester: give each criterion'\''s proof kind per the Proof kinds section of the formulation rules in your read list, and flag a criterion whose proof kind does not match that rule.'
          if ! grep -qF -- "$s" "$f"; then
            printf 'FAILED: %s has no text containing: %s\n' "$f" "$s"
            missing=$((missing + 1))
          fi
          if [ "$missing" -gt 0 ]; then
            echo "Found $missing missing acceptance proof-kind pin(s)"
            exit 1
          fi
          echo "[+] acceptance proof-kind pins are present"

      - name: Check three-amigos reference list names proof kinds for the formulation reference
        run: |
          missing=0
          f=skills/three-amigos/SKILL.md
          for s in \
            '- `references/FORMULATION.md` -- rules for writing Given/When/Then scenarios and for choosing a proof kind per acceptance criterion'
          do
            if ! grep -qxF -- "$s" "$f"; then
              printf 'FAILED: %s has no line equal to: %s\n' "$f" "$s"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "Found $missing missing three-amigos reference list pin(s)"
            exit 1
          fi
          echo "[+] three-amigos reference list names proof kinds"

      # A pin proves the heading line exists in the file, not where it sits or that a reviewer follows it.
      # FORMULATION_PATH overrides the file path so the gate-can-fail proof can point this step at a temp copy; CI never sets it.
      - name: Check the formulation heading is pinned
        run: |
          missing=0
          f="${FORMULATION_PATH:-skills/three-amigos/references/FORMULATION.md}"
          s='## Formulation'
          if ! grep -qxF -- "$s" "$f"; then
            printf 'FAILED: %s has no line equal to: %s\n' "$f" "$s"
            missing=$((missing + 1))
          fi
          if [ "$missing" -gt 0 ]; then
            echo "Found $missing missing formulation heading pin(s)"
            exit 1
          fi
          echo "[+] formulation heading pin is present"

      # This 20,000-character cap (roughly 5,000 tokens at the documented
      # chars/4 estimate) is enforced here only for the core skills listed in
      # the loop below: each was measured and brought under the cap when it
      # was split (honesty from communication; two-stage-review from
      # subagent-driven-development). No repo-wide skill-size cap is
      # CI-enforced; other skills have not been measured against this limit.
      - name: Enforce size cap on core skills
        run: |
          set -e
          limit=20000
          over=0
          for f in skills/honesty/SKILL.md skills/communication/SKILL.md skills/subagent-driven-development/SKILL.md skills/two-stage-review/SKILL.md; do
            size=$(wc -c < "$f")
            if [ "$size" -gt "$limit" ]; then
              echo "FAILED: $f is $size characters, exceeding the $limit-character limit"
              over=$((over + 1))
            fi
          done
          if [ "$over" -gt 0 ]; then
            exit 1
          fi
          echo "[+] core skill files are within the $limit-character cap"

      - name: Hook script smoke test
        run: |
          set -e
          for sh in hooks/*.sh; do
            md="${sh%.sh}.md"
            if [ -f "$md" ]; then
              echo "Smoke-testing $sh..."
              output=$(bash "$sh" 2>&1 </dev/null) || {
                echo "FAILED: $sh exited nonzero"
                exit 1
              }
              printf '%s\n' "$output" | jq empty || {
                echo "FAILED: $sh output is not valid JSON"
                printf 'Output was: %s\n' "$output"
                exit 1
              }
              case "$output" in
                *"[ERROR"*)
                  echo "FAILED: $sh emitted an error envelope"
                  printf 'Output was: %s\n' "$output"
                  exit 1
                  ;;
              esac
            fi
          done
          echo "[+] All hook scripts produce valid, error-free JSON"

      - name: SessionStart source-branch detector
        run: |
          set -e
          cont=$(printf '{"source":"compact"}' | bash hooks/session-start.sh | jq -r '.hookSpecificOutput.additionalContext')
          printf '%s' "$cont" | grep -q "CONTINUATION: source=compact" \
            || { echo "FAILED: compact source did not produce continuation banner"; exit 1; }
          printf '%s' "$cont" | grep -q "Skill(session-bootstrap)" \
            || { echo "FAILED: continuation banner missing the reload instruction"; exit 1; }
          res=$(printf '{"source":"resume"}' | bash hooks/session-start.sh | jq -r '.hookSpecificOutput.additionalContext')
          printf '%s' "$res" | grep -q "CONTINUATION: source=resume" \
            || { echo "FAILED: resume source did not produce continuation banner"; exit 1; }
          fresh=$(printf '{"source":"startup"}' | bash hooks/session-start.sh | jq -r '.hookSpecificOutput.additionalContext')
          if printf '%s' "$fresh" | grep -q "CONTINUATION:"; then
            echo "FAILED: startup source leaked continuation banner"; exit 1; fi
          printf '%s' "$fresh" | grep -q "First Tool Call" \
            || { echo "FAILED: fresh injection missing Iron-Laws block"; exit 1; }
          echo "[+] SessionStart source branching verified (compact->banner+reload, startup->no banner)"

      - name: Verify .claude/hooks symlink integrity
        run: |
          set -e
          broken=0
          for e in .claude/hooks/*; do
            if [ ! -L "$e" ]; then
              echo "FAILED: $e is not a symlink"
              broken=$((broken + 1))
              continue
            fi
            if [ ! -e "$e" ]; then
              echo "FAILED: $e is a dangling symlink"
              broken=$((broken + 1))
            fi
          done
          if [ "$broken" -gt 0 ]; then
            echo "Found $broken broken .claude/hooks entr(y/ies)"
            exit 1
          fi
          echo "[+] All .claude/hooks entries are intact symlinks"

      - name: Check hooks/README.md matches .claude/hooks
        run: |
          set -e
          drift=0
          bt='`'
          for e in .claude/hooks/*; do
            base=$(basename "$e")
            if ! grep -qF -- "${bt}${base}${bt}" hooks/README.md; then
              echo "DRIFT: $base exists in .claude/hooks but is not documented in hooks/README.md"
              drift=$((drift + 1))
            fi
          done
          n=$(find .claude/hooks -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')
          case "$n" in
            1) word=one ;;
            2) word=two ;;
            3) word=three ;;
            4) word=four ;;
            5) word=five ;;
            6) word=six ;;
            7) word=seven ;;
            8) word=eight ;;
            9) word=nine ;;
            10) word=ten ;;
            11) word=eleven ;;
            12) word=twelve ;;
            13) word=thirteen ;;
            14) word=fourteen ;;
            15) word=fifteen ;;
            16) word=sixteen ;;
            17) word=seventeen ;;
            18) word=eighteen ;;
            19) word=nineteen ;;
            20) word=twenty ;;
            *) word="" ;;
          esac
          if [ -z "$word" ]; then
            echo "DRIFT: .claude/hooks has $n entries, outside the 1-20 word map in this gate -- update the gate in .github/workflows/validate.yml"
            drift=$((drift + 1))
          else
            if ! grep -qiwE "$word|$n" hooks/README.md; then
              echo "DRIFT: hooks/README.md does not state the current hook count ($n = '$word')"
              drift=$((drift + 1))
            fi
          fi
          if [ "$drift" -gt 0 ]; then
            echo "Found $drift hooks/README.md drift issue(s)"
            exit 1
          fi
          echo "[+] hooks/README.md matches the current .claude/hooks set and count"

      - name: Run session-events converter unit tests
        run: |
          python3 -m unittest discover -s tools/session_events -p 'test_*.py'
          echo "[+] session-events converter unit tests pass"

      - name: Run context-measure unit tests
        run: |
          python3 -m unittest discover -s tools/context_measure -p 'test_*.py'
          echo "[+] context-measure unit tests pass"

      - name: Run tier usage script unit tests
        run: |
          python3 -m unittest discover -s tools/tier_usage -p 'test_*.py'
          echo "[+] tier usage script unit tests pass"

      - name: Shellcheck role-check scripts
        run: |
          shellcheck skills/subagent-driven-development/scripts/role-check.sh skills/subagent-driven-development/scripts/plan-check.sh skills/subagent-driven-development/scripts/tests/run.sh
          echo "[+] role-check scripts pass shellcheck"

      - name: Run role-boundary detector and plan-marker fixtures
        run: |
          set -e
          sh skills/subagent-driven-development/scripts/tests/run.sh
          echo "[+] role-boundary detector and plan-marker fixtures pass"

      - name: Check the detector in the reference matches the shipped script
        run: |
          set -e
          sed -n '/^```sh$/,/^```$/p' skills/subagent-driven-development/references/THREE_ROLE_LOOP.md | sed '1d;$d' > "$RUNNER_TEMP/role-check-fence.sh"
          if ! cmp "$RUNNER_TEMP/role-check-fence.sh" skills/subagent-driven-development/scripts/role-check.sh; then
            echo "FAILED: the fenced detector in THREE_ROLE_LOOP.md differs from skills/subagent-driven-development/scripts/role-check.sh"
            exit 1
          fi
          echo "[+] fenced detector and shipped script are byte-identical"

      - name: Check plan-check instruction strings
        run: |
          missing=0
          check() {
            file="$1"
            shift
            for s in "$@"; do
              if ! grep -qF -- "$s" "$file"; then
                printf 'FAILED: %s is missing required contract string: %s\n' "$file" "$s"
                missing=$((missing + 1))
              fi
            done
          }
          check agents/story-coordinator.md '`sh <skill dir>/scripts/plan-check.sh <plan file>`' 'Paste the command and its exit code in the pull request body' 'A third exit 1 (after 2 re-runs) is a cap reached hand-back' 'Exit 2 or any other exit code' 'A reconcile and a fresh runner with no plan file skip the plan check.' 'Use cap reached also when the plan check still exits 1 after 2 re-runs.' 'before the first dispatch, and again after any re-plan, run' 'of the plan file and no cd.' 'never pick a value only to pass the check' 'hand back blocked with the error text.' 'the base directory the Skill tool prints when you load the subagent-driven-development skill'
          if [ "$missing" -gt 0 ]; then
            echo "Found $missing missing plan-check instruction string(s)"
            exit 1
          fi
          echo "[+] plan-check instruction strings present"

      - name: Check Discovery line rule strings
        run: |
          missing=0
          check() {
            file="$1"
            shift
            for s in "$@"; do
              if ! grep -qF -- "$s" "$file"; then
                printf 'FAILED: %s is missing required contract string: %s\n' "$file" "$s"
                missing=$((missing + 1))
              fi
            done
          }
          check agents/story-coordinator.md 'Every hand-back sent while your plan file exists carries a Discovery line' 'a hand-back that stops at the Discovery questioning step carries `Discovery: ran`' 'A hand-back sent before your plan file exists, such as kind blocked for an issue with no acceptance criteria, carries none.' 'No other skip reason exists.' 'and the Discovery line whenever your plan file exists.' 'carries no Discovery line, because it has no plan file.' 'a reconcile hand-back carries the Discovery line exactly when your plan file exists.'
          check skills/running-a-sprint/references/HANDBACK_ROUTING.md "When the runner's plan file exists, a Discovery line whose value is exactly" 'When no plan file exists (a blocked hand-back for an issue with no acceptance criteria, or a fresh reconcile runner), the line is absent and its absence is not a missing line.'
          if grep -qF -- 'Every hand-back after planning starts' agents/story-coordinator.md; then
            echo "FAILED: agents/story-coordinator.md still states the old planning-starts condition for the Discovery line"
            missing=$((missing + 1))
          fi
          if [ "$missing" -gt 0 ]; then
            echo "Found $missing missing Discovery line rule string(s)"
            exit 1
          fi
          echo "[+] Discovery line rule strings present"
