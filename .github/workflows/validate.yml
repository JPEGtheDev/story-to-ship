name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate hooks.json
        run: |
          jq empty hooks/hooks.json
          echo "[+] hooks.json is valid JSON"

      - name: Validate .claude-plugin JSON files
        run: |
          jq empty .claude-plugin/plugin.json
          jq empty .claude-plugin/marketplace.json
          echo "[+] .claude-plugin/*.json are valid JSON"

      - name: Shellcheck shell scripts
        run: |
          shellcheck hooks/session-start.sh
          shellcheck hooks/pre-message-gates.sh
          shellcheck hooks/pre-message.sh
          shellcheck hooks/stop-turn-log.sh
          shellcheck hooks/bootstrap-gate-pre.sh
          shellcheck hooks/bootstrap-gate-post.sh
          shellcheck hooks/workflow-model-guard.sh
          shellcheck hooks/shell-write-guard.sh
          shellcheck hooks/inline-edit-guard.sh
          shellcheck hooks/tests/run.sh
          shellcheck hooks/tests/run-bootstrap-gate.sh
          shellcheck hooks/tests/run-pre-message.sh
          shellcheck hooks/tests/run-all.sh
          shellcheck hooks/tests/run-skill-map-drift.sh
          shellcheck hooks/tests/run-workflow-model-guard.sh
          shellcheck hooks/tests/run-shell-write-guard.sh
          shellcheck hooks/tests/run-inline-edit-guard.sh
          shellcheck tools/first_action_audit/first-action-audit.sh
          shellcheck tools/first_action_audit/tests/run.sh
          echo "[+] All shell scripts pass shellcheck"

      - name: Run all hook fixture suites
        run: |
          set -e
          bash hooks/tests/run-all.sh

      - name: Run first-action audit tests
        run: bash tools/first_action_audit/tests/run.sh

      - name: Stop turn-log wedge safety (empty stdin)
        run: |
          set -e
          out=$(printf '' | bash hooks/stop-turn-log.sh)
          test "$out" = "{}" || { echo "FAILED: empty-stdin did not yield {}"; exit 1; }
          printf '%s' "$out" | jq empty || { echo "FAILED: empty-stdin output not valid JSON"; exit 1; }
          echo "[+] Stop turn-log hook: fixture suite passed and empty-stdin is wedge-safe"

      # Cap raised from 470 to 495 to fit the communication skill into the
      # "Core Skill Routing (per turn)" block in hooks/pre-message-gates.md
      # and the Skill-call check in hooks/pre-message.md (both now name
      # honesty and communication); slack kept <=20 words above the actual
      # combined total (gates + message, 477 when the cap was set) to
      # preserve the budget's anti-creep function (a large buffer defeats
      # the point of the gate).
      - name: Enforce pre-message hook word budget
        run: |
          gates=$(wc -w < hooks/pre-message-gates.md)
          message=$(wc -w < hooks/pre-message.md)
          total=$((gates + message))
          echo "pre-message-gates.md: $gates words; pre-message.md: $message words; combined: $total (limit 495)"
          if [ "$total" -gt 495 ]; then
            echo "FAILED: combined pre-message hook word count $total exceeds 495"
            exit 1
          fi
          echo "[+] Combined pre-message hook injection is within the 495-word budget"
          oversize=0
          for pair in pre-message-gates pre-message; do
            full_words=$(wc -w < "hooks/$pair.md")
            loaded_words=$(wc -w < "hooks/$pair-loaded.md")
            echo "$pair-loaded.md: $loaded_words words; $pair.md: $full_words words"
            if [ "$loaded_words" -ge "$full_words" ]; then
              echo "FAILED: hooks/$pair-loaded.md ($loaded_words words) is not smaller than hooks/$pair.md ($full_words words)"
              oversize=$((oversize + 1))
            fi
          done
          if [ "$oversize" -gt 0 ]; then
            exit 1
          fi
          echo "[+] Each loaded pre-message variant is smaller than its full file"

      # Each loaded variant is its full file with the gate section removed.
      # The gate section is the first "## " section of the full file, so the
      # expected loaded file is line 1 of the full file (the opening tag)
      # followed by the full file from its second "## " heading to the end.
      # Line 2 of the full file must be the gate heading, so no text can sit
      # above the gate section unchecked. Changing a shared section in one
      # file but not the other fails here; an edit inside the gate section
      # alone does not.
      - name: Check loaded pre-message variants match their full files
        run: |
          set -e
          drift=0
          for pair in pre-message-gates pre-message; do
            full="hooks/$pair.md"
            loaded="hooks/$pair-loaded.md"
            if ! diff -u "$loaded" <(awk 'FNR == 1 { print; next } FNR == 2 && !/^## / { print "(line 2 of the full file is not a ## heading)" } /^## / { headings++ } headings >= 2' "$full"); then
              echo "DRIFT: $loaded is not line 1 of $full followed by $full from its second '## ' heading (diff above: - is the loaded file, + is the expected text)"
              drift=$((drift + 1))
            fi
          done
          if [ "$drift" -gt 0 ]; then
            exit 1
          fi
          echo "[+] Each loaded pre-message variant is its full file minus the gate section"

      - name: Check for broken references in skill files
        run: |
          set -e
          broken=0
          for f in skills/*/SKILL.md; do
            dir=$(dirname "$f")
            while IFS= read -r ref; do
              [ -z "$ref" ] && continue
              target="$dir/$ref"
              if [ ! -f "$target" ]; then
                echo "BROKEN: $f references $ref (not found at $target)"
                broken=$((broken + 1))
              fi
            done < <(grep -o '\(references\|tools\)/[A-Za-z0-9_./-]*\.md' "$f" | sort -u)
          done
          if [ "$broken" -gt 0 ]; then
            echo "Found $broken broken reference(s)"
            exit 1
          fi
          echo "[+] All skill references resolve to existing files"

      - name: Validate SKILL.md frontmatter
        run: |
          set -e
          for f in skills/*/SKILL.md; do
            name=$(sed -n 's/^name: \(.*\)$/\1/p' "$f" | head -1)
            desc=$(sed -n 's/^description: \(.*\)$/\1/p' "$f" | head -1)
            if [ -z "$name" ]; then
              echo "MISSING: $f has no 'name' field in frontmatter"
              exit 1
            fi
            if [ -z "$desc" ]; then
              echo "MISSING: $f has no 'description' field in frontmatter"
              exit 1
            fi
          done
          echo "[+] All SKILL.md files have required frontmatter (name, description)"

      - name: Reject unquoted colon-space in agents/ and SKILL.md frontmatter values
        # AGENTS_DIR and SKILLS_DIR exist so the gate-can-fail proofs can point this
        # step at temp copies; CI never sets them.
        run: |
          set -e
          # A frontmatter value that is unquoted and contains a colon followed by a
          # space (or ends with a colon) is not valid YAML: a parser reads the colon
          # as a second mapping. Quoted, bracketed, and braced values are skipped.
          pat="^ *[A-Za-z_-]+: [^\"'[{].*(: |:\$)"
          fail=0
          for f in "${AGENTS_DIR:-agents}"/*.md "${SKILLS_DIR:-skills}"/*/SKILL.md; do
            hits=$(sed -n '2,/^---$/p' "$f" | grep -nE "$pat" || true)
            if [ -n "$hits" ]; then
              printf 'INVALID FRONTMATTER VALUE: %s -- %s\n' "$f" "$hits"
              fail=$((fail + 1))
            fi
          done
          if [ "$fail" -gt 0 ]; then
            echo "Found $fail frontmatter block(s) with a colon-space inside an unquoted value"
            echo "Hint: use ' -- ' instead of ': ' inside the value, or quote the whole value"
            exit 1
          fi
          echo "[+] No agents/ or skills/*/SKILL.md frontmatter value contains an unquoted colon-space"

      - name: Check agent template contracts
        run: |
          set -e
          missing=0
          check() {
            file="$1"
            shift
            for s in "$@"; do
              if ! grep -qF -- "$s" "$file"; then
                printf 'FAILED: %s is missing required contract string: %s\n' "$file" "$s"
                missing=$((missing + 1))
              fi
            done
          }
          checkx() {
            file="$1"
            shift
            for s in "$@"; do
              if ! grep -qxF -- "$s" "$file"; then
                printf 'FAILED: %s has no line equal to: %s\n' "$file" "$s"
                missing=$((missing + 1))
              fi
            done
          }
          check agents/implementer.md "FINAL reply message" "Limitations:" "ASCII"
          check agents/code-quality-reviewer.md "Evidence Spot-Check" "IMPLEMENTER_EVIDENCE"
          check agents/skill-reviewer.md "IMPLEMENTER_EVIDENCE"
          check skills/writing-skills/references/REVIEW_INSTRUCTIONS.md "Evidence Spot-Check"
          check agents/postmortem-reviewer.md "Limitation-disclosure audit" "Evidence-spot-check audit" "Buried-caveat audit" "Blocker-disclosure audit" "Dispatch-routing audit" "Correction-source audit" "Correction-source itemization"
          check agents/architecture-reviewer.md "git -C {{WORKTREE_PATH}} rev-parse --show-toplevel" "{{DIFF_OR_EMPTY}}" "VERDICT: APPROVE | REQUEST CHANGES"
          check agents/rehearsal-subject.md "Dispatches made:" "Limitations:" "ASCII" "{{SKILL_TEXT_PATHS}}" "{{FIXTURE_PATH}}" "{{DISPATCH_BUDGET}}"
          check skills/subagent-driven-development/SKILL.md "Spend-bearing launches need explicit consent PER INVOCATION"
          check skills/writing-plans/SKILL.md "ask the owner, or run Discovery) before presenting the plan"
          # The checkx lines below copy the deferral gate (SKILL.md) and the whole deferral reference word for word, on purpose:
          # a rule change must be a deliberate edit here too. checkx needs a line equal to the pin, so text added to a pinned line fails.
          # Known limit: a pin only proves its line exists somewhere in the file; added, wrapped or moved text is not detected.
          checkx skills/writing-plans/SKILL.md '## Decision-Deferral Gate' 'Before todos, apply `references/DECISION_DEFERRAL.md` to each significant architectural or infrastructure component and record `DECIDE NOW`, `DEFER -- revisit when [condition]`, or `[UNCLEAR:] -- answer [question]`. A DEFER component'\''s todos use its simplest valid option; an `[UNCLEAR:]` component gets no todo until resolved. Rewrite a DEFER whose condition names no observable event or threshold ("later", "when needed", "eventually") as a measurable one.'
          checkx skills/writing-plans/references/DECISION_DEFERRAL.md '# Decision Deferral Reference' 'Run the deferral diagnostic on every significant architectural or infrastructure component a plan would add, before any todo is written. The diagnostic asks three yes/no questions and records one verdict per component: decide it now, defer it until a named condition, or mark it unclear. The writing-plans gate runs the diagnostic; this file holds everything needed to apply it.'
          checkx skills/writing-plans/references/DECISION_DEFERRAL.md '## Significant Component' 'A component is significant when the choice is hard to reverse, adds an external dependency (software the project does not own and must track), or fixes a boundary that other work builds on. Examples: a persistence layer, messaging, an external service, a language or framework. Default for borderline cases: when borderline, run the diagnostic.' 'A component that already exists in the repo and is not added by the plan is not diagnosed, because the plan did not choose it.'
          checkx skills/writing-plans/references/DECISION_DEFERRAL.md '## The Three Questions' 'Answer each question yes or no for the component.' '1. **Blocked?** Do two or more requirements contradict each other, or is a fact missing that stops you from answering the other questions? What the task or issue text asserts or presupposes counts as stated; for example, a request that compares two client libraries for a message bus states that the bus is in use.' '2. **Needed?** Does a todo, test, or requirement in the plan need the answer? The simplest valid option is the simplest option that satisfies every stated requirement and adds no new component or dependency (direct calls instead of a broker, no cache, standard-library access instead of a library); not adding the component counts as an option. Needed is yes when no simplest valid option exists (a language, a first data store), and no when one exists and lets every todo proceed.' '3. **Costly?** Once other work builds on the choice, is reversing it expensive (rework across more than one todo, a data migration, or a changed interface)?'
          checkx skills/writing-plans/references/DECISION_DEFERRAL.md '## Verdict Rule' 'Apply the rows in order. The first row that matches decides the verdict.' '| Answers | Verdict |' '| Blocked = yes | `[UNCLEAR:] -- answer [question]` -- name the specific contradiction or the specific missing-fact question |' '| Needed = no | `DEFER -- revisit when [condition]` -- the condition must pass the rubric below |' '| Needed = yes, Costly = yes | `DECIDE NOW` -- carry a named risk: what goes wrong if the choice is left open |' '| Needed = yes, Costly = no | `DECIDE NOW` -- pick the simplest option that satisfies every stated requirement; the named risk is the todo or requirement that cannot proceed without it |'
          checkx skills/writing-plans/references/DECISION_DEFERRAL.md '## Why DEFER: You Ain'\''t Gonna Need It (YAGNI)' 'YAGNI says to build only what the plan needs now. A choice that nothing forces yet, because the simplest valid option lets every todo proceed, is a guess about the future, and a wrong guess costs rework. Deferring trades a possible later migration for not guessing now: the simplest valid option carries every todo meanwhile, the facts that settle the choice arrive with the work that needs it, and the measurable condition bounds when the migration is weighed.'
          checkx skills/writing-plans/references/DECISION_DEFERRAL.md '## Why DECIDE NOW: Named Risk' 'A costly choice that no todo can proceed without cannot wait: each todo written on top of an open choice adds rework if the choice lands differently. Naming the risk proves the decision is forced. If you cannot say what goes wrong when the choice stays open, nothing forces it, and the verdict is DEFER.'
          checkx skills/writing-plans/references/DECISION_DEFERRAL.md '## Measurability Rubric for a DEFER Condition' 'A measurable condition names an observable event or threshold that someone else can check without asking you what you meant.' '- Passing: `when the first integration test touches the database layer`' '- Failing: `when the time is right`' 'These vague words fail on their own: "later", "when needed", "eventually", "when the time is right". The list is illustrative: any condition that names no observable event or threshold fails.'
          checkx skills/writing-plans/references/DECISION_DEFERRAL.md '## Failure-Path Rules' '- A DEFER whose condition is only vague language, or mixes vague clauses with no measurable clause, is rejected and rewritten as a measurable condition. If no measurable condition can be named, the verdict becomes `[UNCLEAR:] -- answer [question]` where the question asks what would force the decision.' '- A DECIDE NOW that depends on a fact the plan does not state becomes `[UNCLEAR:] -- answer [that fact]` only when it decides, by itself, whether an option satisfies a stated requirement or contradicts one. A fact that only ranks the valid options (every option still works whichever way the fact goes) does not block: pick the simplest option that satisfies every stated requirement and record the unstated fact it assumes as the named risk. An unstated requirement is a missing fact, which the Blocked question catches.' '- A DECIDE NOW with no nameable risk is malformed and is not emitted; the verdict falls to DEFER because nothing forces the decision.' '- An `[UNCLEAR:]` with no named question or contradiction is malformed.' '- A todo that depends on a DEFER component uses that component'\''s simplest valid option and adopts no other option; a todo that needs an option beyond the simplest valid option is rewritten or removed. An `[UNCLEAR:]` component gets no todo until it is resolved.' '- The diagnostic runs after the Situation Gate of writing-plans. For the component it covers, a DEFER verdict wins over that gate'\''s row "Architectural decision".' '- An `[UNCLEAR:]` verdict falls under the writing-plans "Red Flag" on `[UNCLEAR:]` markers: resolve it (ask the owner, the person who assigned the work, or run Discovery, the clarifying step of the three-amigos skill) before the plan is presented, then re-run the three questions for that component.'
          checkx skills/writing-plans/references/DECISION_DEFERRAL.md '## Recording Verdicts' 'Write one line per component in the plan file, before the todos. Each line names the component and its verdict in the exact spelling above.' 'A plan with no significant component records the exact line:' 'Deferral gate: no significant components'
          awk '!b && /^[|] Blocked = yes [|]/ {b=NR} !n && /^[|] Needed = no [|]/ {n=NR} END {exit !(b && n && b < n)}' skills/writing-plans/references/DECISION_DEFERRAL.md || { printf 'FAILED: the Blocked = yes row must come before the Needed = no row in skills/writing-plans/references/DECISION_DEFERRAL.md\n'; missing=$((missing + 1)); }
          check skills/finishing-a-development-branch/SKILL.md "Text written after that message is labelled in the body as added after approval"
          check skills/finishing-a-development-branch/SKILL.md "Every promised item is found in the drafted body file before gh pr create runs"
          check skills/two-stage-review/SKILL.md "SPEC COMPLIANCE FIRST, THEN CODE QUALITY" "{{IMPLEMENTER_EVIDENCE}}" "Adversarial scenario tested" "Canary confirmed"
          check skills/two-stage-review/SKILL.md "A Stage 1 or Stage 2 result whose verdict is missing, or is not one of the verdict values that reviewer's template defines, counts as not passed."
          check skills/two-stage-review/SKILL.md "After 3 fix rounds on one todo without both stages passing, stop that todo and end the turn with a prompt to the owner that states the open findings."
          check skills/two-stage-review/SKILL.md "A verdict value that the replying reviewer's own template defines with its own qualifier, such as PASS (size advisory) in the skill-reviewer template, counts as written; among qualifiers, only one that template does not define makes a verdict unreadable."
          check skills/two-stage-review/SKILL.md "Judging a concern in an implementer result behavior-affecting is the trigger for the owner prompt, not a license to fix it: end the turn with the prompt before any fix or dispatch."
          check skills/honesty/SKILL.md "buried caveat"
          check skills/honesty/SKILL.md "Self-blame needs the same evidence bar"
          check skills/honesty/SKILL.md "consent-class action"
          check skills/communication/SKILL.md "if you have to parse the reply's wording to decide whether it counts as approval, it is not approval"
          check skills/communication/SKILL.md "Define every term of art in one plain clause at its first use"
          check skills/communication/SKILL.md "The first sentence of a reply to a correction states the evidence examined or the check being run"
          check skills/communication/SKILL.md "a finding states what the code does, never what the author must not know, understand, or have tested"
          check skills/self-evaluation/SKILL.md "Failure-instance evidence bar" "first-action-audit.sh"
          check skills/versioning/SKILL.md "Merging is the user's gate."
          check skills/execution/SKILL.md "State a guard denial in the next message you write, before the next tool call: what was denied and what runs instead."
          check skills/execution/SKILL.md "A copy that is only read or run is allowed once the denial is stated; a copy whose content is carried back into the denied target is the denied edit retried, and it goes to an implementer."
          check skills/execution/SKILL.md "Writing a commit message, in a dispatch prompt or in a git commit call, is creating a commit: load the versioning skill first if it is not loaded this session."
          check agents/postmortem-reviewer.md "{{TRANSCRIPT_PATH}}" "blame direction"
          if [ "$missing" -gt 0 ]; then
            printf 'Found %s missing contract string(s)\n' "$missing"
            exit 1
          fi
          echo "[+] All agent template contracts present"

      - name: Check agent templates index matches agents/
        run: |
          set -e
          # IDX_PATH/AGENTS_DIR overrides exist only so the gate-can-fail proofs can
          # point this step at temp copies; CI never sets them.
          idx="${IDX_PATH:-skills/subagent-driven-development/references/AGENT_TEMPLATES.md}"
          agents_dir="${AGENTS_DIR:-agents}"
          missing=0
          for f in "$agents_dir"/*.md; do
            fm=$(sed -n '2,/^---$/p' "$f")
            desc=$(printf '%s\n' "$fm" | grep '^description: ' | sed 's/^description: //')
            model=$(printf '%s\n' "$fm" | grep '^model: ' | sed 's/^model: //')
            if printf '%s' "$desc" | grep -qF '|'; then
              printf 'FAILED: %s description contains a pipe, which breaks the index table row\n' "$f"
              missing=$((missing + 1))
              continue
            fi
            row="| \`$(basename "$f")\` | $desc | $model |"
            if ! grep -qF -- "$row" "$idx"; then
              printf 'FAILED: index missing or stale row for %s\n' "$f"
              missing=$((missing + 1))
            fi
          done
          while IFS= read -r line; do
            file=$(printf '%s\n' "$line" | sed -n 's/^| `\([^`]*\)`.*/\1/p')
            if [ -n "$file" ] && [ ! -f "$agents_dir/$file" ]; then
              printf 'FAILED: index lists %s which does not exist in agents/\n' "$file"
              missing=$((missing + 1))
            fi
          done < <(grep '^| `' "$idx")
          if [ "$missing" -gt 0 ]; then
            printf 'Found %s issue(s) in the agent templates index\n' "$missing"
            exit 1
          fi
          echo "[+] agent templates index matches agents/"

      # This 20,000-character cap (roughly 5,000 tokens at the documented
      # chars/4 estimate) is enforced here only for the core skills listed in
      # the loop below: each was measured and brought under the cap when it
      # was split (honesty from communication; two-stage-review from
      # subagent-driven-development). No repo-wide skill-size cap is
      # CI-enforced; other skills have not been measured against this limit.
      - name: Enforce size cap on core skills
        run: |
          set -e
          limit=20000
          over=0
          for f in skills/honesty/SKILL.md skills/communication/SKILL.md skills/subagent-driven-development/SKILL.md skills/two-stage-review/SKILL.md; do
            size=$(wc -c < "$f")
            if [ "$size" -gt "$limit" ]; then
              echo "FAILED: $f is $size characters, exceeding the $limit-character limit"
              over=$((over + 1))
            fi
          done
          if [ "$over" -gt 0 ]; then
            exit 1
          fi
          echo "[+] core skill files are within the $limit-character cap"

      - name: Hook script smoke test
        run: |
          set -e
          for sh in hooks/*.sh; do
            md="${sh%.sh}.md"
            if [ -f "$md" ]; then
              echo "Smoke-testing $sh..."
              output=$(bash "$sh" 2>&1 </dev/null) || {
                echo "FAILED: $sh exited nonzero"
                exit 1
              }
              printf '%s\n' "$output" | jq empty || {
                echo "FAILED: $sh output is not valid JSON"
                printf 'Output was: %s\n' "$output"
                exit 1
              }
              case "$output" in
                *"[ERROR"*)
                  echo "FAILED: $sh emitted an error envelope"
                  printf 'Output was: %s\n' "$output"
                  exit 1
                  ;;
              esac
            fi
          done
          echo "[+] All hook scripts produce valid, error-free JSON"

      - name: SessionStart source-branch detector
        run: |
          set -e
          cont=$(printf '{"source":"compact"}' | bash hooks/session-start.sh | jq -r '.hookSpecificOutput.additionalContext')
          printf '%s' "$cont" | grep -q "CONTINUATION: source=compact" \
            || { echo "FAILED: compact source did not produce continuation banner"; exit 1; }
          printf '%s' "$cont" | grep -q "Skill(session-bootstrap)" \
            || { echo "FAILED: continuation banner missing the reload instruction"; exit 1; }
          res=$(printf '{"source":"resume"}' | bash hooks/session-start.sh | jq -r '.hookSpecificOutput.additionalContext')
          printf '%s' "$res" | grep -q "CONTINUATION: source=resume" \
            || { echo "FAILED: resume source did not produce continuation banner"; exit 1; }
          fresh=$(printf '{"source":"startup"}' | bash hooks/session-start.sh | jq -r '.hookSpecificOutput.additionalContext')
          if printf '%s' "$fresh" | grep -q "CONTINUATION:"; then
            echo "FAILED: startup source leaked continuation banner"; exit 1; fi
          printf '%s' "$fresh" | grep -q "First Tool Call" \
            || { echo "FAILED: fresh injection missing Iron-Laws block"; exit 1; }
          echo "[+] SessionStart source branching verified (compact->banner+reload, startup->no banner)"

      - name: Verify .claude/hooks symlink integrity
        run: |
          set -e
          broken=0
          for e in .claude/hooks/*; do
            if [ ! -L "$e" ]; then
              echo "FAILED: $e is not a symlink"
              broken=$((broken + 1))
              continue
            fi
            if [ ! -e "$e" ]; then
              echo "FAILED: $e is a dangling symlink"
              broken=$((broken + 1))
            fi
          done
          if [ "$broken" -gt 0 ]; then
            echo "Found $broken broken .claude/hooks entr(y/ies)"
            exit 1
          fi
          echo "[+] All .claude/hooks entries are intact symlinks"

      - name: Check hooks/README.md matches .claude/hooks
        run: |
          set -e
          drift=0
          bt='`'
          for e in .claude/hooks/*; do
            base=$(basename "$e")
            if ! grep -qF -- "${bt}${base}${bt}" hooks/README.md; then
              echo "DRIFT: $base exists in .claude/hooks but is not documented in hooks/README.md"
              drift=$((drift + 1))
            fi
          done
          n=$(find .claude/hooks -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')
          case "$n" in
            1) word=one ;;
            2) word=two ;;
            3) word=three ;;
            4) word=four ;;
            5) word=five ;;
            6) word=six ;;
            7) word=seven ;;
            8) word=eight ;;
            9) word=nine ;;
            10) word=ten ;;
            11) word=eleven ;;
            12) word=twelve ;;
            13) word=thirteen ;;
            14) word=fourteen ;;
            15) word=fifteen ;;
            16) word=sixteen ;;
            17) word=seventeen ;;
            18) word=eighteen ;;
            19) word=nineteen ;;
            20) word=twenty ;;
            *) word="" ;;
          esac
          if [ -z "$word" ]; then
            echo "DRIFT: .claude/hooks has $n entries, outside the 1-20 word map in this gate -- update the gate in .github/workflows/validate.yml"
            drift=$((drift + 1))
          else
            if ! grep -qiwE "$word|$n" hooks/README.md; then
              echo "DRIFT: hooks/README.md does not state the current hook count ($n = '$word')"
              drift=$((drift + 1))
            fi
          fi
          if [ "$drift" -gt 0 ]; then
            echo "Found $drift hooks/README.md drift issue(s)"
            exit 1
          fi
          echo "[+] hooks/README.md matches the current .claude/hooks set and count"

      - name: Run evaluation-evidence gate unit tests
        run: |
          python3 -m unittest discover -s tools/evaluation_evidence_gate -p 'test_*.py'
          echo "[+] evaluation-evidence gate unit tests pass"

      - name: Run session-events converter unit tests
