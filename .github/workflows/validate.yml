name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate hooks.json
        run: |
          jq empty hooks/hooks.json
          echo "[+] hooks.json is valid JSON"

      - name: Validate .claude-plugin JSON files
        run: |
          jq empty .claude-plugin/plugin.json
          jq empty .claude-plugin/marketplace.json
          echo "[+] .claude-plugin/*.json are valid JSON"

      - name: Shellcheck shell scripts
        run: |
          shellcheck hooks/session-start.sh
          shellcheck hooks/pre-message-gates.sh
          shellcheck hooks/pre-message.sh
          shellcheck hooks/stop-turn-log.sh
          shellcheck hooks/bootstrap-gate-pre.sh
          shellcheck hooks/bootstrap-gate-post.sh
          shellcheck hooks/workflow-model-guard.sh
          shellcheck hooks/shell-write-guard.sh
          shellcheck hooks/inline-edit-guard.sh
          shellcheck hooks/tests/run.sh
          shellcheck hooks/tests/run-bootstrap-gate.sh
          shellcheck hooks/tests/run-pre-message.sh
          shellcheck hooks/tests/run-all.sh
          shellcheck hooks/tests/run-skill-map-drift.sh
          shellcheck hooks/tests/run-workflow-model-guard.sh
          shellcheck hooks/tests/run-shell-write-guard.sh
          shellcheck hooks/tests/run-inline-edit-guard.sh
          shellcheck tools/first_action_audit/first-action-audit.sh
          shellcheck tools/first_action_audit/tests/run.sh
          echo "[+] All shell scripts pass shellcheck"

      - name: Run all hook fixture suites
        run: |
          set -e
          bash hooks/tests/run-all.sh

      - name: Run first-action audit tests
        run: bash tools/first_action_audit/tests/run.sh

      - name: Stop turn-log wedge safety (empty stdin)
        run: |
          set -e
          out=$(printf '' | bash hooks/stop-turn-log.sh)
          test "$out" = "{}" || { echo "FAILED: empty-stdin did not yield {}"; exit 1; }
          printf '%s' "$out" | jq empty || { echo "FAILED: empty-stdin output not valid JSON"; exit 1; }
          echo "[+] Stop turn-log hook: fixture suite passed and empty-stdin is wedge-safe"

      # Cap raised from 470 to 495 to fit the communication skill into the
      # "Core Skill Routing (per turn)" block in hooks/pre-message-gates.md
      # and the Skill-call check in hooks/pre-message.md (both now name
      # honesty and communication); slack kept <=20 words above the actual
      # combined total (gates + message, 477 when the cap was set) to
      # preserve the budget's anti-creep function (a large buffer defeats
      # the point of the gate).
      - name: Enforce pre-message hook word budget
        run: |
          gates=$(wc -w < hooks/pre-message-gates.md)
          message=$(wc -w < hooks/pre-message.md)
          total=$((gates + message))
          echo "pre-message-gates.md: $gates words; pre-message.md: $message words; combined: $total (limit 495)"
          if [ "$total" -gt 495 ]; then
            echo "FAILED: combined pre-message hook word count $total exceeds 495"
            exit 1
          fi
          echo "[+] Combined pre-message hook injection is within the 495-word budget"
          oversize=0
          for pair in pre-message-gates pre-message; do
            full_words=$(wc -w < "hooks/$pair.md")
            loaded_words=$(wc -w < "hooks/$pair-loaded.md")
            echo "$pair-loaded.md: $loaded_words words; $pair.md: $full_words words"
            if [ "$loaded_words" -ge "$full_words" ]; then
              echo "FAILED: hooks/$pair-loaded.md ($loaded_words words) is not smaller than hooks/$pair.md ($full_words words)"
              oversize=$((oversize + 1))
            fi
          done
          if [ "$oversize" -gt 0 ]; then
            exit 1
          fi
          echo "[+] Each loaded pre-message variant is smaller than its full file"

      # Each loaded pre-message variant is either silent (no non-whitespace
      # content, any number of lines) or exactly one line, counted with
      # grep -c '' so a last line without a trailing newline still counts.
      - name: Check loaded pre-message variants are empty or a single line
        run: |
          set -e
          failed=0
          for name in pre-message-gates-loaded pre-message-loaded; do
            file="hooks/$name.md"
            if [ ! -f "$file" ]; then
              echo "FAILED: $file is missing"
              failed=$((failed + 1))
              continue
            fi
            if [ -z "$(tr -d '[:space:]' < "$file")" ]; then
              echo "$file: silent (no non-whitespace content)"
              continue
            fi
            lines=$(grep -c '' "$file")
            if [ "$lines" -ne 1 ]; then
              echo "FAILED: $file has $lines lines; a loaded variant must be empty or exactly one line"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            exit 1
          fi
          echo "[+] Each loaded pre-message variant is empty or a single line"

      - name: Check three-role loop contract strings
        run: |
          set -e
          missing=0
          check() {
            file="$1"
            shift
            for s in "$@"; do
              if ! grep -qF -- "$s" "$file"; then
                printf 'FAILED: %s is missing required contract string: %s\n' "$file" "$s"
                missing=$((missing + 1))
              fi
            done
          }
          # These pins prove the wording exists in the file, not that a coordinator follows it.
          check skills/subagent-driven-development/references/THREE_ROLE_LOOP.md 'A change to any other file is a finding, and the todo returns for a fresh test-writer.'
          check skills/subagent-driven-development/references/THREE_ROLE_LOOP.md 'The dispatcher never reuses or resumes a role child.'
          check skills/subagent-driven-development/references/THREE_ROLE_LOOP.md 'case $role in test-writer | pass-maker | refactorer) ;; *) echo "unknown role: $role" >&2; exit 2 ;; esac'
          check skills/subagent-driven-development/references/THREE_ROLE_LOOP.md 'if [ -z "$status" ] && [ "$role" != refactorer ]; then echo "VIOLATION $role commit changes nothing"; bad=1; fi'
          check skills/subagent-driven-development/SKILL.md 'see `references/THREE_ROLE_LOOP.md` (three role dispatches, role rules, boundary detector)'
          check skills/writing-plans/references/TODO_TEMPLATES.md 'A todo whose row has a blank cell is not dispatched; it returns to planning.'
          check skills/writing-plans/references/TODO_TEMPLATES.md '- `loop: three-role` when the todo adds or changes behaviour in a non-prose source file of a repo with a runnable test suite.'
          check skills/writing-plans/references/TODO_TEMPLATES.md '- `loop: single` for prose, config, a repo with no runnable suite, a pure refactor or deletion, fix rounds after the end review, and reconcile fix rounds.'
          check skills/testing/SKILL.md '**Three-role loop:**'
          check skills/subagent-driven-development/references/THREE_ROLE_LOOP.md 'Editing, deleting or skipping a test is a finding.'
          check skills/subagent-driven-development/references/THREE_ROLE_LOOP.md 'A behaviour change is a finding.'
          check agents/implementer.md 'Role: [test-writer | pass-maker | refactorer | single]'
          check agents/implementer.md '{{ROLE_RULES}}'
          check skills/subagent-driven-development/references/THREE_ROLE_LOOP.md 'the dispatcher fills it with the line `Role: <role>`'
          check agents/story-coordinator.md 'the type or interface, module, and collaborators cells must all be filled'
          check agents/story-coordinator.md 'is a cap reached hand-back for that todo.'
          check agents/story-coordinator.md 'A todo that mixes code and prose is split into two todos before dispatch.'
          check agents/plan-reviewer.md '8. **Seams and loop marker.**'
          check skills/subagent-driven-development/references/THREE_ROLE_LOOP.md 'if git rev-parse --verify -q "$commit^2" >/dev/null; then echo "merge commit: check by hand" >&2; exit 2; fi'
          check skills/subagent-driven-development/references/THREE_ROLE_LOOP.md 'which must print 1, except 0 for a refactorer that reports `no refactor needed`.'
          check skills/testing/SKILL.md 'A test-writer whose test passes at once returns BLOCKED and does not fix the test itself.'
          check skills/testing/SKILL.md 'The one commit allowed before the failing test is the stub commit'
          check skills/writing-plans/references/TODO_TEMPLATES.md 'Architecture review: <verdict line from the architecture-review skill>'
          check skills/writing-plans/references/TODO_TEMPLATES.md '- A todo mixing code and prose is split into a code todo and a prose todo.'
          check skills/writing-plans/references/TODO_TEMPLATES.md 'A `loop: three-role` todo runs alone and is never put in a batch of todos that run at the same time.'
          check skills/subagent-driven-development/references/THREE_ROLE_LOOP.md 'the new test must FAIL with a run-time assertion failure'
          check agents/story-coordinator.md 'set its `{{ROLE_RULES}}` input to the `Role: <role>` line'
          check agents/story-coordinator.md 'Any other number is a boundary finding.'
          check agents/story-coordinator.md 'does not count toward the cap; record why in the plan entry.'
          check agents/plan-reviewer.md 'Is any todo one that mixes code and prose (it must be split)?'
          check skills/subagent-driven-development/references/THREE_ROLE_LOOP.md 'bad test-path pattern: $test_re'
          check skills/subagent-driven-development/references/THREE_ROLE_LOOP.md 'The new failing test is a second, separate test-writer dispatch'
          check agents/story-coordinator.md 'a fresh pass-maker dispatch (one commit, detector run) follows it'
          check skills/subagent-driven-development/references/THREE_ROLE_LOOP.md 'it writes type or signature stubs and build-registration files only, with no behaviour'
          check skills/subagent-driven-development/SKILL.md 'Every implementer dispatch fills `{{ROLE_RULES}}`'
          check skills/subagent-driven-development/references/THREE_ROLE_LOOP.md 'Makes exactly one commit, the test commit; no WIP commit.'
          check skills/subagent-driven-development/references/THREE_ROLE_LOOP.md 'Makes exactly one commit, the passing commit; no WIP commit.'
          check skills/subagent-driven-development/references/THREE_ROLE_LOOP.md 'Makes at most one commit, the refactor commit (none when it reports `no refactor needed`); no WIP commit.'
          check agents/implementer.md 'The commit rules in your role block override the commit advice under Constraints.'
          if [ "$missing" -gt 0 ]; then
            echo "Found $missing missing three-role loop contract string(s)"
            exit 1
          fi
          echo "[+] Three-role loop contract strings present"

      - name: Check for broken references in skill files
        run: |
          set -e
          broken=0
          for f in skills/*/SKILL.md; do
            dir=$(dirname "$f")
            while IFS= read -r ref; do
              [ -z "$ref" ] && continue
              target="$dir/$ref"
              if [ ! -f "$target" ]; then
                echo "BROKEN: $f references $ref (not found at $target)"
                broken=$((broken + 1))
              fi
            done < <(grep -o '\(references\|tools\)/[A-Za-z0-9_./-]*\.md' "$f" | sort -u)
          done
          if [ "$broken" -gt 0 ]; then
            echo "Found $broken broken reference(s)"
            exit 1
          fi
          echo "[+] All skill references resolve to existing files"

      - name: Validate SKILL.md frontmatter
        run: |
          set -e
          for f in skills/*/SKILL.md; do
            name=$(sed -n 's/^name: \(.*\)$/\1/p' "$f" | head -1)
            desc=$(sed -n 's/^description: \(.*\)$/\1/p' "$f" | head -1)
            if [ -z "$name" ]; then
              echo "MISSING: $f has no 'name' field in frontmatter"
              exit 1
            fi
            if [ -z "$desc" ]; then
              echo "MISSING: $f has no 'description' field in frontmatter"
              exit 1
            fi
          done
          echo "[+] All SKILL.md files have required frontmatter (name, description)"

      - name: Reject unquoted colon-space in agents/ and SKILL.md frontmatter values
        # AGENTS_DIR and SKILLS_DIR exist so the gate-can-fail proofs can point this
        # step at temp copies; CI never sets them.
        run: |
          set -e
          # A frontmatter value that is unquoted and contains a colon followed by a
          # space (or ends with a colon) is not valid YAML: a parser reads the colon
          # as a second mapping. Quoted, bracketed, and braced values are skipped.
          pat="^ *[A-Za-z_-]+: [^\"'[{].*(: |:\$)"
          fail=0
          for f in "${AGENTS_DIR:-agents}"/*.md "${SKILLS_DIR:-skills}"/*/SKILL.md; do
            hits=$(sed -n '2,/^---$/p' "$f" | grep -nE "$pat" || true)
            if [ -n "$hits" ]; then
              printf 'INVALID FRONTMATTER VALUE: %s -- %s\n' "$f" "$hits"
              fail=$((fail + 1))
            fi
          done
          if [ "$fail" -gt 0 ]; then
            echo "Found $fail frontmatter block(s) with a colon-space inside an unquoted value"
            echo "Hint: use ' -- ' instead of ': ' inside the value, or quote the whole value"
            exit 1
          fi
          echo "[+] No agents/ or skills/*/SKILL.md frontmatter value contains an unquoted colon-space"

      - name: Require one tools line in agents/ frontmatter
        # AGENTS_DIR exists so the gate-can-fail proofs can point this step at a
        # temp copy; CI never sets it. A template with no tools line inherits every
        # tool, which is the cost this gate keeps out.
        run: |
          set -e
          fail=0
          for f in "${AGENTS_DIR:-agents}"/*.md; do
            fm=$(sed -n '2,/^---$/p' "$f")
            closed=$(printf '%s\n' "$fm" | tail -n 1)
            n=$(printf '%s\n' "$fm" | grep -cE '^tools: *[A-Za-z]' || true)
            other=$(printf '%s\n' "$fm" | sed '$d' | grep -cvE '^[A-Za-z_-]+: ' || true)
            if [ "$closed" != "---" ] || [ "$other" -ne 0 ] || [ "$n" -ne 1 ]; then
              printf 'FAILED: %s needs one non-empty tools: line in a closed frontmatter block of key: value lines (tools lines %s, other lines %s)\n' "$f" "$n" "$other"
              fail=$((fail + 1))
            fi
          done
          if [ "$fail" -gt 0 ]; then
            echo "Found $fail agents/ template(s) without a valid tools: line"
            exit 1
          fi
          echo "[+] Every agents/ template has one tools: line in its frontmatter"

      - name: Check agent template contracts
        run: |
          set -e
          missing=0
          check() {
            file="$1"
            shift
            for s in "$@"; do
              if ! grep -qF -- "$s" "$file"; then
                printf 'FAILED: %s is missing required contract string: %s\n' "$file" "$s"
                missing=$((missing + 1))
              fi
            done
          }
          checkx() {
            file="$1"
            shift
            for s in "$@"; do
              if ! grep -qxF -- "$s" "$file"; then
                printf 'FAILED: %s has no line equal to: %s\n' "$file" "$s"
                missing=$((missing + 1))
              fi
            done
          }
          checkabsent() {
            file="$1"
            pattern="$2"
            if [ ! -f "$file" ]; then
              printf 'FAILED: %s not found\n' "$file"
              missing=$((missing + 1))
              return 0
            fi
            rc=0
            hits=$(grep -iE -- "$pattern" "$file") || rc=$?
            if [ "$rc" -gt 1 ]; then
              printf 'FAILED: could not scan %s for the sizing pattern (grep exit %s)\n' "$file" "$rc"
              missing=$((missing + 1))
              return 0
            fi
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              printf 'FAILED: %s still contains a file-count or tool-call sizing limit: %s\n' "$file" "$line"
              missing=$((missing + 1))
            done <<< "$hits"
          }
          check agents/implementer.md "FINAL reply message" "Limitations:" "ASCII"
          check agents/code-quality-reviewer.md "Evidence Spot-Check" "IMPLEMENTER_EVIDENCE"
          check agents/skill-reviewer.md "IMPLEMENTER_EVIDENCE"
          check skills/writing-skills/references/REVIEW_INSTRUCTIONS.md "Evidence Spot-Check"
          check agents/postmortem-reviewer.md "Limitation-disclosure audit" "Evidence-spot-check audit" "Buried-caveat audit" "Blocker-disclosure audit" "Dispatch-routing audit" "Correction-source audit" "Correction-source itemization"
          check agents/architecture-reviewer.md "git -C {{WORKTREE_PATH}} rev-parse --show-toplevel" "{{DIFF_OR_EMPTY}}" "VERDICT: APPROVE | REQUEST CHANGES"
          # Verdict and question-list rulings: pins detect wording only, not whether an agent follows it.
          checkx agents/infrastructure-reviewer.md '- There is no SAFE verdict with an open INTRODUCED issue -- every INTRODUCED checklist failure is ISSUES FOUND; a run whose failures are all PRE-EXISTING is SAFE' 'ISSUES FOUND means the PR has at least one INTRODUCED issue that must be resolved before merge. SAFE means it has none. One verdict per case:' '- No findings: SAFE' '- PRE-EXISTING findings only: SAFE, each logged as a separate non-blocking cleanup task' '- At least one INTRODUCED finding: ISSUES FOUND'
          checkabsent agents/infrastructure-reviewer.md 'There is no SAFE verdict with open issues'
          checkx skills/infrastructure-review/SKILL.md '[-] Any unmet INTRODUCED item -> verdict: ISSUES FOUND; every unmet item PRE-EXISTING -> SAFE, each logged as a cleanup task -- document in review report' 'A verdict of ISSUES FOUND means the PR is NOT mergeable until every INTRODUCED NO item is resolved, and an INTRODUCED failure in any area makes the PR verdict ISSUES FOUND. A PR whose only failures are PRE-EXISTING is SAFE, with a cleanup task logged. Classify each unmet item as INTRODUCED or PRE-EXISTING by the attribution method in the infrastructure reviewer agent template before writing the verdict.'
          checkabsent skills/infrastructure-review/SKILL.md 'Any unmet -> verdict: ISSUES FOUND|every NO item|unmet PRE-EXISTING items'
          checkx agents/skeptic.md '## Questions to answer (twelve, required -- do not skip any)' '9. **What is the strongest argument against this approach?**' '10. **What is the most likely way this fails in practice?**' '11. **Does every claim that two competing constraints are both satisfied come with a worked example carried end-to-end?** If not, name the missing example. If the plan makes no such claim, say NONE.' '12. **Does every claim that a cut or moved passage is restated elsewhere carry pasted search output showing the other text?** If not, name the claim. If the plan makes no such claim, say NONE.' 'Full-scan contradictions: [grep commands and output, or "no matches"]' 'Strongest argument against: [one short paragraph naming the plan line it targets]' 'Likely failure in practice: [the trigger and the first observable symptom]' 'Competing-constraint claims without a worked example: [list or NONE]' 'Restatement claims without search output: [list or NONE]'
          skeptic_questions=$(grep -c '^[0-9]*\. \*\*' agents/skeptic.md) || true
          if [ "$skeptic_questions" -ne 12 ]; then
            printf 'FAILED: agents/skeptic.md has %s numbered questions, expected 12\n' "$skeptic_questions"
            missing=$((missing + 1))
          fi
          checkabsent skills/writing-plans/references/SKEPTIC_PROMPT.md 'six questions|these six'
          checkx skills/writing-plans/references/SKEPTIC_PROMPT.md 'Answer every question under "Questions to answer" in agents/skeptic.md (read that file first if it is not already in your instructions; if you cannot read it, return STATUS: BLOCKED naming the missing file), in order, and no others.'
          check agents/rehearsal-subject.md "Dispatches made:" "Limitations:" "ASCII" "{{SKILL_TEXT_PATHS}}" "{{FIXTURE_PATH}}" "{{DISPATCH_BUDGET}}"
          check skills/subagent-driven-development/SKILL.md "Spend-bearing launches need explicit consent PER INVOCATION"
          check skills/writing-plans/SKILL.md "ask the owner, or run Discovery) before presenting the plan"
          # The pointer in SKILL.md and the moved plan-review headings in PLAN_REVIEW.md: pins detect deleted wording only.
          checkx skills/writing-plans/SKILL.md 'For any plan with 2+ todos or an architectural decision, dispatch a review agent before implementation. Before dispatching the review, read `references/PLAN_REVIEW.md`: it holds the routing by whether Discovery ran, the Skeptic Agent and plan-reviewer dispatch, and the Review-Round Cap.'
          checkx skills/writing-plans/references/PLAN_REVIEW.md '### Review-Round Cap' '**Otherwise (no Discovery):**' 'Dispatch BOTH agents in parallel: a **Skeptic Agent** and the **plan-reviewer agent**. Read both verdicts before presenting the plan as final.'
          checkx skills/writing-plans/SKILL.md '**Permissive-clause closure:** when a review finds an ambiguous or permissive clause, close it by deleting the clause, not rewording it -- rewording can make the bypass easier (e.g. "the user asks" -> "the user directs the change" turned a stretch into a bright-line match). If you must reword, test the new wording against the concrete evasion sentence that exploited the old wording.'
          # These pins prove presence and absence of wording only, not that a todo is sized correctly.
          checkx skills/writing-plans/SKILL.md 'A todo is one behaviour or one reviewable change with one objective that one review can judge; split it when it holds two independently verifiable objectives or when one review could not judge it.'
          checkx agents/implementer.md 'A todo is one behaviour or one reviewable change with one objective that one review can judge; split it when it holds two independently verifiable objectives or when one review could not judge it.'
          # Floor, not a full list: catches the known old sizing wording and close paraphrases, not every possible rewording.
          sizing_ban='(at most|no more than|max|<=) ?(2|two) (non-test )?files|(3|three)(\+| or more) (non-test )?files|(25|twenty-five)\+? tool[- ]calls|tool calls? *> *25|<=2 (non-test )?files|3\+ non-test|2 non-test|26\+|25 tool|<=25|exceeds 25|file count|sizing limit'
          checkabsent skills/writing-plans/SKILL.md "$sizing_ban"
          checkabsent agents/implementer.md "$sizing_ban"
          checkabsent skills/three-amigos/references/CEREMONIES.md "$sizing_ban"
          # The checkx lines below copy the deferral gate (SKILL.md) and the whole deferral reference word for word, on purpose:
          # a rule change must be a deliberate edit here too. checkx needs a line equal to the pin, so text added to a pinned line fails.
          # Known limit: a pin only proves its line exists somewhere in the file; added, wrapped or moved text is not detected.
          checkx skills/writing-plans/SKILL.md '## Decision-Deferral Gate' 'Before todos, apply `references/DECISION_DEFERRAL.md` to each significant architectural or infrastructure component and record `DECIDE NOW`, `DEFER -- revisit when [condition]`, or `[UNCLEAR:] -- answer [question]`. A DEFER component'\''s todos use its simplest valid option; an `[UNCLEAR:]` component gets no todo until resolved. Rewrite a DEFER whose condition names no observable event or threshold ("later", "when needed", "eventually") as a measurable one.'
          checkx skills/writing-plans/references/DECISION_DEFERRAL.md '# Decision Deferral Reference' 'Run the deferral diagnostic on every significant architectural or infrastructure component a plan would add, before any todo is written. The diagnostic asks three yes/no questions and records one verdict per component: decide it now, defer it until a named condition, or mark it unclear. The writing-plans gate runs the diagnostic; this file holds everything needed to apply it.'
          checkx skills/writing-plans/references/DECISION_DEFERRAL.md '## Significant Component' 'A component is significant when the choice is hard to reverse, adds an external dependency (software the project does not own and must track), or fixes a boundary that other work builds on. Examples: a persistence layer, messaging, an external service, a language or framework. Default for borderline cases: when borderline, run the diagnostic.' 'A component that already exists in the repo and is not added by the plan is not diagnosed, because the plan did not choose it.'
          checkx skills/writing-plans/references/DECISION_DEFERRAL.md '## The Three Questions' 'Answer each question yes or no for the component.' '1. **Blocked?** Do two or more requirements contradict each other, or is a fact missing that stops you from answering the other questions? What the task or issue text asserts or presupposes counts as stated; for example, a request that compares two client libraries for a message bus states that the bus is in use.' '2. **Needed?** Does a todo, test, or requirement in the plan need the answer? The simplest valid option is the simplest option that satisfies every stated requirement and adds no new component or dependency (direct calls instead of a broker, no cache, standard-library access instead of a library); not adding the component counts as an option. Needed is yes when no simplest valid option exists (a language, a first data store), and no when one exists and lets every todo proceed.' '3. **Costly?** Once other work builds on the choice, is reversing it expensive (rework across more than one todo, a data migration, or a changed interface)?'
          checkx skills/writing-plans/references/DECISION_DEFERRAL.md '## Verdict Rule' 'Apply the rows in order. The first row that matches decides the verdict.' '| Answers | Verdict |' '| Blocked = yes | `[UNCLEAR:] -- answer [question]` -- name the specific contradiction or the specific missing-fact question |' '| Needed = no | `DEFER -- revisit when [condition]` -- the condition must pass the rubric below |' '| Needed = yes, Costly = yes | `DECIDE NOW` -- carry a named risk: what goes wrong if the choice is left open |' '| Needed = yes, Costly = no | `DECIDE NOW` -- pick the simplest option that satisfies every stated requirement; the named risk is the todo or requirement that cannot proceed without it |'
          checkx skills/writing-plans/references/DECISION_DEFERRAL.md '## Why DEFER: You Ain'\''t Gonna Need It (YAGNI)' 'YAGNI says to build only what the plan needs now. A choice that nothing forces yet, because the simplest valid option lets every todo proceed, is a guess about the future, and a wrong guess costs rework. Deferring trades a possible later migration for not guessing now: the simplest valid option carries every todo meanwhile, the facts that settle the choice arrive with the work that needs it, and the measurable condition bounds when the migration is weighed.'
          checkx skills/writing-plans/references/DECISION_DEFERRAL.md '## Why DECIDE NOW: Named Risk' 'A costly choice that no todo can proceed without cannot wait: each todo written on top of an open choice adds rework if the choice lands differently. Naming the risk proves the decision is forced. If you cannot say what goes wrong when the choice stays open, nothing forces it, and the verdict is DEFER.'
          checkx skills/writing-plans/references/DECISION_DEFERRAL.md '## Measurability Rubric for a DEFER Condition' 'A measurable condition names an observable event or threshold that someone else can check without asking you what you meant.' '- Passing: `when the first integration test touches the database layer`' '- Failing: `when the time is right`' 'These vague words fail on their own: "later", "when needed", "eventually", "when the time is right". The list is illustrative: any condition that names no observable event or threshold fails.'
